{t:"При съставянето на алгоритъм е необходимо:",h:`<p>Изпълнителят е робот, който умее само прости неща. Отключи изискванията с три свързани задачи – блоковете от втората задача се появяват в третата.</p><details open><summary>Задача 1<span class=req>Да използвате само елементарни (за изпълнителя) действия.</span></summary><p>Сложно или елементарно? Реши за всяко действие.</p><div id=cc></div></details><details open><summary>Задача 2<span class=req>Да представите сложното действие чрез последователност от по-прости действия, достъпни за изпълнителя.</span></summary><p>Разбий „Намери фалшивата монета“: отметни простите стъпки и натисни „Провери“. Отметнатите стъпки се превръщат в блокове за задача 3.</p><div id=dc></div><button class=run onclick=dck()>▶ Провери</button><div id=dcm></div></details><details open><summary>Задача 3<span class=req>Да опишете ясно и точно последователността, в която трябва да се изпълняват елементарните действия.</span></summary><p id=o3n class=mu></p><div id=o3></div></details>`,f(){$('#cc').innerHTML=CC.map((c,k)=>`<div class=card id=cr${k}>${c[0]}<br><button onclick="cc(${k},1)">Елементарно</button><button onclick="cc(${k},0)">Сложно</button> <span></span></div>`).join('');window.cc=(k,v)=>{$('#cr'+k).lastElementChild.innerHTML=v==CC[k][1]?'<span class=ok>✓ Да.</span> '+(v?'Изпълнителят го прави веднага.':'Сложно е – разбий го на по-прости стъпки.'):'<span class=no>✗ Не.</span> '+(CC[k][1]?'Това е просто – изпълнителят го умее.':'Изпълнителят не знае как – трябват по-прости стъпки.')};$('#dc').innerHTML=DC.map((c,k)=>`<label style="display:block"><input type=checkbox id=d${k} style="width:auto"> ${c[0]}</label>`).join('');SI('o3',[B("Постави 3 монети на лявото блюдо","","П"),B("Постави други 3 монети на дясното блюдо","","П"),B("Претегли"),B("Погледни накъде се наклони везната"),{...B("Просто познай коя е"),d:1},{...B("Намери фалшивата монета"),d:1}],'Двата реда на поставяне на монетите са равностойни, но претеглянето трябва да е след т {t:"Три начина за описание",h:`<p>Алгоритъмът се описва <b>словесно</b>, с <b>блок-схема</b> и на <b>програмен език</b>. Пример: сума за плащане при покупка на стоки с тегла k1, k2, k3 и цени c1, c2, c3.</p><div class=card><button class=on id=tw0 onclick=tw(0)>Словесно</button><button id=tw1 onclick=tw(1)>Блок-схема</button><button id=tw2 onclick=tw(2)>Програмен език</button><div id=twv></div></div>`,f(){const T=['<p>1) S1 = k1·c1<br>2) S2 = k2·c2<br>3) S3 = k3·c3<br>4) S = S1 + S2 + S3<br>5) Отговор: сумата за плащане е S.</p><p class=mu>Лесно за разбиране от човек, но не винаги точно.</p>',FL('w',[["Начало","ov"],["Вход: k1,k2,k3,c1,c2,c3","pa"],["S1=k1·c1; S2=k2·c2; S3=k3·c3",""],["S = S1+S2+S3",""],["Изход: S","pa"],["Край","ov"]]).replace('id=w','id=w'),`<p>Програма на Python – промени я и я изпълни в симулацията:</p><textarea id=pyc rows=6 spellcheck=false style="width:100%;font:14px/1.4 monospace;background:#0d1d20;color:#d8f3ee;border:0;border-radius:8px;padding:10px"></textarea><p><button class=run onclick=pyRun()>▶ Изпълни</button><button onclick=pyReset()>↺ Начален код</button></p><pre id=con style="min-height:2em"></pre><div id=pym></div><div id=pys></div><div class=card><b>Задание:</b> А как да направим така, че потребителят сам да въвежда количеството (теглата) и цените на стоките?<br><span class=mu>Насока: функцията input() чете въведен текст, а float() го превръща в число. Добави ги там, където стойностите са вписани в кода. Опитай сам – симулацията ще те пита за всяка стойност.</span></div><p>Кодът може да се изпробва и в истинска среда: <a href="https://www.online-python.com/" target=_blank rel=noopener>online-python.com</a> – постави кода и натисни Run.</p>`];window.tw=k=>{$('#twv').innerHTML=T[k];if(k==2)$('#pyc').value=PY0;[0,1,2].forEach(z=>$('#tw'+z).classList.toggle('on',z==k))};tw(0)}},
{t:"6. Описание чрез блок-схеми",h:`<p>Блок-схемата показва алгоритъма с графични фигури, свързани със стрелки. <b>6.1. Основни фигури</b> – натисни фигура, за да разбереш за какво служи.</p><div class=fs id=shp></div><div class=card id=inf>Натисни фигура.</div><button class=run onclick=gst()>🎮 Игра: познай фигурата</button><p id=gmm></p>`,f(){gm=0;drS()}},
{t:"Игра: Покупка на стоки",h:`<p>Подреди действията от пример 1 в правилната блок-схема. Блоковете за S1, S2 и S3 могат да са в произволен ред.</p><div id=g1></div>${QQ("st",6,"С колко стъпки се изпълнява алгоритъмът (без Начало и Край)?","Вход, три умножения, събиране и изход – общо 6.","Преброй блоковете между „Начало“ и „Край“. S1, S2 и S3 са три отделни стъпки.")}${D("Кои данни са входни и кои изходни?","Входни: теглата k1, k2, k3 и цените c1, c2, c3. Изходни: общата сума за плащане S.")}`,f(){SI('g1',[B("Начало","ov"),B("Вход: k1, k2, k3, c1, c2, c3","pa"),B("S1 = k1·c1","","S"),B("S2 = k2·c2","","S"),B("S3 = k3·c3","","S"),B("S = S1 + S2 + S3"),B("Изход: S","pa"),B("Край","ov")],'Първо влизат данните, после се изчислява, накрая се извежда резултатът.')}},
{t:"Игра: През реката",h:`<p>Земеделецът трябва да превози вълка, козата и зелето на другия бряг. Лодката побира него и най-много един обект. Вълкът не може да остане с козата, нито козата със зелето без земеделеца. Подреди блок-схемата на алгоритъма. Превозването на вълка и на зелето може да е в двата реда.</p><div id=g2></div>`,f(){SI('g2',[B("Начало","ov"),B("Превози козата","",null),B("Върни се сам"),B("Превози вълка","","В"),B("Върни козата"),B("Превози зелето","","В"),B("Върни се сам"),B("Превози козата"),B("Всички на десния бряг?","di"),B("Край","ov",null,"ДА →")],'Козата се превозва първа и се връща, за да не остава с вълка или със зелето. Накрая се превозва отново, а условието проверява дали всички са преминали.')}},
{t:"6.2. Видове блок-схеми",h:`<p>Според пътя, по който „тече“ изпълнението, блок-схемите са три вида. Избери вид и пусни изпълнението – блоковете светват в реда на изпълнение.</p><p><button class=on id=tb0 onclick=ty(0)>Линейни</button><button id=tb1 onclick=ty(1)>Разклонени</button><button id=tb2 onclick=ty(2)>Циклични</button></p><div id=ty0 class=card><p>Въведени са дължини на две прилежащи страни в правоъгълник. Да се състави алгоритъм и изчертае блок схема за изчисляване на периметър и лице.</p>${FL('l',NL)}<p>a <input id=la type=number value=3> b <input id=lb type=number value=4> <button class=run onclick=ra()>▶ Пусни</button></p><p id=lm></p>${D("Словесно описание","1. Начало. 2. Въвеждат се a и b. 3. P = 2·(a+b). 4. S = a·b. 5. Извеждат се P и S. 6. Край.")}</div><div id=ty1 class=card hidden><p>Имаме въведено естествено число – година. Да се изведе съобщение дали годината е високосна. <small class=mu>(Високосна е, ако е кратна на 4 и не е столетие, или ако е столетие и е кратна на 400.)</small></p>${FL('b',NB)}<p>Година N <input id=bn type=number value=2024> <button class=run onclick=rb2()>▶ Пусни</button></p><p id=bm></p>${D("Словесно описание","1. Начало. 2. Въвежда се N. 3. Проверява се ((N кратно на 4) и (N не е кратно на 100)) или (N кратно на 400). При ДА – т. 4, при НЕ – т. 5. 4. Извежда се „високосна година“ и се преминава към т. 6. 5. Извежда се „не е високосна“. 6. Край.")}</div><div id=ty2 class=card hidden><p>Да се състави цикличен алгоритъм за въвеждане стойност на N елемента от числова редица.</p>${FL('c',NC)}<p>N (1–6) <input id=cn type=number value=3> <button class=run onclick=rc()>▶ Пусни</button></p><p id=cm></p>${D("Словесно описание","1. Начало. 2. Въвежда се N. 3. i = 0. 4. i = i + 1. 5. Въвежда се Ai. 6. Проверява се i < N: при ДА се връщаме към т. 4, при НЕ – т. 7. 7. Край.")}</div>`,f(){ty(0)}},
{t:"Задача 1 (линейна)",h:`<div class=card>За правоъгълен триъгълник са въведени радиуси r – на вписаната и R – на описаната окръжност около триъгълника. Да се състави линеен алгоритъм за изчисляване на периметъра.</div>${D("Подсказка","Хипотенузата c е диаметър на описаната окръжност. В правоъгълен триъгълник a + b − c = 2·r.")}<div id=t1></div>`,f(){SI('t1',[B("Начало","ov"),B("Вход: r, R","pa"),B("c = 2·R"),B("s = 2·r + c"),B("P = s + c"),B("Изход: P","pa"),B("Край","ov")],'c = 2R е хипотенузата, s = a + b = 2r + c, а периметърът е P = s + c = 2r + 4R.',F1)}},
{t:"Задача 2 (разклонена)",h:`<div class=card>С помощта на блокова схема създайте разклонен алгоритъм за решаване на квадратно уравнение a·x² + b·x + c = 0 (a ≠ 0).</div>${D("Подсказка","Дискриминантата D = b² − 4ac показва дали има реални корни: при D < 0 няма.")}<div id=t2></div>`,f(){SI('t2',[B("Начало","ov"),B("Вход: a, b, c","pa"),B("D = b² − 4·a·c"),B("D < 0 ?","di"),B("Изход: „Няма реални корни“","pa",null,"ДА →"),B("x1 = (−b + √D) / (2·a)","","X","НЕ →"),B("x2 = (−b − √D) / (2·a)","","X","НЕ →"),B("Изход: x1, x2","pa",null,"НЕ →"),B("Край","ov")],'Условието разклонява алгоритъма: при ДА се извежда съобщение, при НЕ се изчисляват корените (при D = 0 те са равни).',F2)}},
{t:"Задача 3 (циклична)",h:`<div class=card>С помощта на блокова схема създайте цикличен алгоритъм за въвеждане и извеждане на N елемента от редица.</div><p class=mu>Условието „i < N ?“: при ДА се връщаме към „i = i + 1“, при НЕ – към „Край“.</p><div id=t3></div>`,f(){SI('t3',[B("Начало","ov"),B("Вход: N","pa"),B("i = 0"),B("i = i + 1"),B("Вход: Ai","pa"),B("Изход: Ai","pa"),B("i < N ?","di"),B("Край","ov",null,"НЕ →")],'Броячът i се увеличава с 1, елементът се въвежда и извежда. Докато i < N, цикълът се повтаря.',F3)}}

function prs(s){const P='(?<![\\p{L}])',R=[['E','иначе'],['G','(?:(?:премин|върни|връщ|повтар|повтор|отиди|продължи|започни)[\\p{L}]*[^.,;\\d]*?|(?:към|до|от|на)\\s+(?:стъпка\\s*)?)(\\d+)(?!\\s*(?:м(?![\\p{L}])|метр))'],['R','(?:повтар|повтор|върни се|връщ|отново|следващ|всяко|всеки|докато|цикъл)[\\p{L}]*'],['I','(?:начал|дън|старт|започва|нула)[\\p{L}]*'],['U','(?:нагоре|изкач|катер|кач|покатер|горе)[\\p{L}]*'],['W','(?:надолу|слез|слиз|плъз|спусн|спуска|пада|долу)[\\p{L}]*'],['C','(?:ако|дали|провер|стигн|достиг|върх|излез|излиз|изляз|излъз|изход|горния)[\\p{L}]*'],['X','(?:прекрат|край|спри|спира|стоп|завърш|приключ|свърши|свършва)[\\p{L}]*']],o=[];R.forEach(([t,p])=>{const m=new RegExp(P+p,'iu').exec(s);if(m)o.push({t,i:m.index,n:+(m[1]||0)})});return (o.some(a=>a.t=='G')?o.filter(a=>a.t!='R'):o).sort((a,b)=>a.i-b.i)}
function rbo(L,D){const fu=L.findIndex(A=>A.some(a=>a.t=='U'));let pc=0,pos=0,days=0,t=0,note='';while(t++<300){if(pc>=L.length)return{e:'Алгоритъмът свърши, без да е казано кога охлювът излиза (липсва проверка и „прекрати“).'};const A=L[pc],has=x=>A.some(b=>b.t==x),lp=has('R')&&has('U')&&has('W')&&!has('G');let cond=null,jmp=-1,els=false,stop=0;for(const a of A){if(a.t=='E'){els=true;continue}if(cond!==null&&(els?cond:!cond))continue;if(a.t=='I')pos=0;else if(a.t=='U'){pos+=2;days++;if(lp&&pos>=D){stop=1;break}}else if(a.t=='W')pos-=1;else if(a.t=='C'){if(!lp)cond=pos>=D}else if(a.t=='R'){if(lp)note='Разбрах „повтори/докато“ като повтаряне на изкачването и слизането, докато охлювът излезе.';else{jmp=fu>=0?fu:0;note='Разбрах „повтори“ като връщане към първото изкачване.';break}}else if(a.t=='G'){jmp=a.n-1;break}else if(a.t=='X'){stop=1;break}}if(stop)return{pos,days,note};if(lp&&jmp<0)jmp=pc;if(jmp>=L.length||jmp<-1)return{e:'Няма такава стъпка за преминаване.'};pc=jmp>=0?jmp:pc+1}return{e:'Алгоритъмът никога не свършва – липсва условие, което да го прекрати.'}}
let AT=0;
function rb0(raw,ad){const L=[];for(let k=0;k<raw.length;k++){const A=prs(raw[k]);ad(A.length?'ok':'no',(k+1)+'. '+raw[k]+(A.length?' ✓':' ✗'));if(!A.length){ad('no','🤖 Спирам при стъпка '+(k+1)+': не разбирам това действие. Опиши с прости думи какво прави охлювът.');return 0}L.push(A)}const has=t=>L.some(A=>A.some(a=>a.t==t)),q=[];if(!has('I'))q.push('Каква е стъпката за началото – къде е охлювът в началото?');if(!has('U'))q.push('Каква е стъпката за изкачването на охлюва през деня?');if(!has('W'))q.push('Каква е стъпката за слизането му през нощта?');if(!has('C')||!has('X'))q.push('Каква е стъпката, която казва кога охлювът е излязъл и алгоритъмът свършва?');if(!has('G')&&!has('R'))q.push('Каква е стъпката за повтаряне на действията за следващото денонощие – към коя стъпка се връщам?');if(q.length){q.forEach(x=>ad('no','🤖 '+x));ad('mu','Допиши липсващите стъпки и ме пусни отново.');return 0}let good=1,nt='',off=0;for(const [D,ex] of [[6,5],[12,11]]){const r=rbo(L,D);if(r.e){ad('no','🤖 Алгоритъмът не работи: '+r.e);return 0}nt=r.note||nt;if(r.pos<D){ad('no',`🤖 При ${D} м роботът прекрати, но охлювът е едва на ${r.pos} м. Не работи.`);good=0;continue}const ok=r.days==ex;if(!ok){good=0;if(r.days==ex+1)off=1}ad(ok?'ok':'no',`При ${D} м роботът получи ${r.days} денонощия – очаквам ${ex}. ${ok?'✓':'✗'}`)}if(nt)ad('mu','🤖 '+nt);ad(good?'ok':'no',good?'✓ Алгоритъмът работи! Логически е свързан и може да се изпълни.':'✗ Алгоритъмът не работи за всички дълбочини. '+(off?'Подсказка: охлювът се изкачва и слиза, след като вече е излязъл – проверката трябва да е между изкачването и слизането.':'Проследи денонощие по денонощие какво прави роботът.'));return good}
function rb(){const o=$('#rob');o.innerHTML='';$('#ans').innerHTML='';const raw=MY.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>x.replace(/^\d+[.)]\s*/,'')),ad=(c,t)=>{const d=document.createElement('div');d.className=c;d.textContent=t;o.append(d)};if(!raw.length){ad('no','Първо напиши стъпките.');return}AT++;if(!rb0(raw,ad)&&AT>=3)$('#ans').innerHTML='<p>Опитите са '+AT+'. <button onclick=ra2()>💡 Покажи отговора</button></p>'}
